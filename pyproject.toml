[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-bridge"
version = "0.1.0"
description = "QQ playlists to GD Music and fnOS, with verified transfers"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "mutagen>=1.47,<2", "opencc-python-reimplemented==0.1.7"]

[project.scripts]
music-bridge = "music_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["music_bridge*"]
